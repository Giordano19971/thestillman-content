name: Build week

on:
  push:
    branches: [main]
    paths: ["content/weeks/**", "pipeline/**", "brand/**"]
  workflow_dispatch:
    inputs:
      week_file:
        description: "Week file to build (default: newest in content/weeks)"
        required: false

permissions:
  contents: write

concurrency:
  group: build-week
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install ffmpeg and libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libcairo2 fonts-dejavu-core
          pip install -q requests pyyaml pillow cairosvg "opencv-python-headless<5"
      - name: Build newest week
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          FILES="${{ github.event.inputs.week_file }}"
          if [ -z "$FILES" ]; then
            CUTOFF=$(date -u -d '7 days ago' +%Y-%m-%d)
            FILES=$(for f in content/weeks/*.yaml; do w=$(basename "$f" .yaml); [[ "$w" > "$CUTOFF" || "$w" == "$CUTOFF" ]] && echo "$f"; done)
          fi
          cd pipeline
          rc=0
          for FILE in $FILES; do echo "Building $FILE"; python build_week.py "../$FILE" || rc=1; done
          exit $rc
      - name: Commit built media
        if: always()
        run: |
          git config user.name "still-man-bot"
          git config user.email "still-man-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Build media for week [skip ci]"
          git push

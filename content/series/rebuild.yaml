# The 30-Day Rebuild — nightly series at 23:30 (Europe/Rome), one day per night, starting Wednesday 2026-11-18.
# The weekly planner copies days into content/weeks/<Monday>.yaml as posts "<day>-late" (style fields below),
# using the full scripts when present and writing the missing ones from the arc (same rules, same voice).
series: The 30-Day Rebuild
start_date: 2026-11-18
slot: "23:30"
style: {caption_words: 3, caption_lower: true, caption_style: serif_italic, grade: mono, allow_statues: true}
rules: >-
  Hook max 8 words. 40-55 words. Third person ("he", "a still man"). One concrete exercise per day.
  Last line: "Day N+1 tomorrow. Follow so you don't miss it." (Day 30 ends: "The rebuild is done. The man stays.")
  Caption first line: "The 30-Day Rebuild — Day N." Hashtags include #30dayrebuild #thestillman.
arc:
  week1_foundation: [1 The honest audit, 2 One wake-up time, 3 The doorway posture, 4 The long exhale, 5 Half-speed words, 6 The first hour without a phone, 7 One kept promise]
  week2_presence: [8 Eye contact for one sentence, 9 The two-second pause, 10 Taking up space, 11 Listening to the end, 12 Hands that stay still, 13 Walking slower, 14 The week-two review]
  week3_connection: [15 The first word, 16 Joining a group, 17 The follow-up question, 18 Saying no once, 19 The calm text, 20 The good goodbye, 21 One honest conversation]
  week4_self_respect: [22 Training on the bad day, 23 Leaving early, 24 Eating alone in public, 25 The apology without shrinking, 26 Money and quiet, 27 Saying the hard thing calmly, 28 The letter to day one, 29 What stays, 30 The still man]
days:
  - day: 1
    title: "Day 1 · The honest audit"
    voiceover: >-
      Every rebuild starts with one honest look. Tonight... he writes three lines. Where he shrinks. Where he rushes.
      Where he waits for permission. No judgment. Just the map. Thirty days from now... he reads it again.
      Day two tomorrow. Follow so you don't miss it.
    highlight: [honest, shrinks, rushes, permission, map]
    broll: ["img: notebook pen candle dark", "img: marble statue face", "img: old map desk", "img: stone stairs light", "img: marble bust profile", "img: night window city", "img: mountain path dawn", "img: classical sculpture dark"]
    caption: "The 30-Day Rebuild — Day 1. Three lines. No judgment. Just the map.\n\n#30dayrebuild #selfimprovement #quietconfidence #thestillman"
  - day: 2
    title: "Day 2 · One wake-up time"
    voiceover: >-
      Calm starts the night before. Day two... he picks one wake-up time. Same time. Every day. Weekends too.
      Not early to impress anyone. Fixed... so the body stops negotiating. A steady morning... builds a steady man.
      Day three tomorrow. Follow so you don't miss it.
    highlight: [calm, one, same, steady, man]
    broll: ["img: bedside clock night", "img: sunrise window bedroom", "img: marble statue face", "img: calm sea dawn", "img: marble bust light", "img: coffee steam morning", "img: road sunrise", "img: classical sculpture shadow"]
    caption: "The 30-Day Rebuild — Day 2. One wake-up time. Every day.\n\n#30dayrebuild #morningroutine #discipline #thestillman"
  - day: 3
    title: "Day 3 · The doorway posture"
    voiceover: >-
      People read his body before his words. Day three... every doorway is a reset. Before walking through,
      he drops his shoulders, lifts his chest, slows his step. Ten doorways a day. Ten small resets.
      By day thirty... it's simply how he walks. Day four tomorrow. Follow so you don't miss it.
    highlight: [body, doorway, shoulders, resets, walks]
    broll: ["img: open door light", "img: marble statue standing", "img: stone archway", "img: marble bust profile", "img: hallway light dark", "img: ancient columns", "img: classical sculpture dark", "img: stairs light"]
    caption: "The 30-Day Rebuild — Day 3. Every doorway is a reset.\n\n#30dayrebuild #bodylanguage #posture #thestillman"
  - day: 4
    title: "Day 4 · The long exhale"
    voiceover: >-
      Nerves live in the breath first. Day four... before every hard moment, one long exhale. Out for longer than in.
      Before the call. Before the room. Before the reply. It tells the body: nothing here is chasing him.
      Day five tomorrow. Follow so you don't miss it.
    highlight: [breath, exhale, longer, body, chasing]
    broll: ["img: calm lake mist", "img: marble statue face", "img: candle flame dark", "img: still water reflection", "img: marble bust dark", "img: fog mountains", "img: ocean horizon calm", "img: classical sculpture light"]
    caption: "The 30-Day Rebuild — Day 4. Out for longer than in.\n\n#30dayrebuild #breathwork #calm #thestillman"
  - day: 5
    title: "Day 5 · Half-speed words"
    voiceover: >-
      Fast talk sounds like asking for permission. Day five... he speaks at half speed for one full day.
      Shorter sentences. Full stops. A pause before the answer. It will feel too slow. It isn't.
      To everyone else... it sounds like control. Day six tomorrow. Follow so you don't miss it.
    highlight: [permission, half, pause, slow, control]
    broll: ["img: hourglass dark", "img: marble statue face", "img: old books candle", "img: marble bust profile", "img: chess board dark", "img: quiet library", "img: stone sculpture shadow", "img: calm sea night"]
    caption: "The 30-Day Rebuild — Day 5. Half speed sounds like control.\n\n#30dayrebuild #communication #confidence #thestillman"
  - day: 6
    title: "Day 6 · The first hour, no phone"
    voiceover: >-
      Whoever gets his first hour... gets his day. Day six... the phone stays in another room for sixty minutes after waking.
      Water. Light. A few lines on paper. The world can wait one hour. A man who starts calm... rarely ends rushed.
      Day seven tomorrow. Follow so you don't miss it.
    highlight: [first, hour, phone, wait, calm]
    broll: ["img: morning window light", "img: notebook coffee desk", "img: marble statue face", "img: sunrise mountains", "img: marble bust light", "img: glass of water light", "img: quiet room morning", "img: classical sculpture dark"]
    caption: "The 30-Day Rebuild — Day 6. Whoever gets his first hour gets his day.\n\n#30dayrebuild #morningroutine #digitaldetox #thestillman"
  - day: 7
    title: "Day 7 · One kept promise"
    voiceover: >-
      Confidence is a promise kept... repeatedly. Day seven... he makes one small promise to himself and keeps it.
      Ten push-ups. Bed by eleven. One page. Small enough to never miss. Week one is done. The foundation is set.
      Week two starts tomorrow. Follow so you don't miss it.
    highlight: [promise, kept, small, foundation, tomorrow]
    broll: ["img: stone foundation", "img: marble statue face", "img: notebook pen dark", "img: mountain summit dawn", "img: marble bust profile", "img: ancient ruins sunset", "img: candle book dark", "img: classical sculpture light"]
    caption: "The 30-Day Rebuild — Day 7. Week one done. The foundation is set.\n\n#30dayrebuild #discipline #selfrespect #thestillman"
  - day: 8
    title: "Day 8 · Eye contact for one sentence"
    voiceover: >-
      Week two is about presence. Day eight... he holds eye contact for one full sentence. Not a stare. Just until the sentence ends. Then a slow look away. One conversation today. Then three. Steady eyes say... he isn't hiding. Day nine tomorrow. Follow so you don't miss it.
    highlight: [presence, eye, sentence, steady, hiding]
    broll: ["img: marble statue eyes", "img: night window city", "img: marble bust profile", "img: candle flame dark", "img: stone sculpture face", "img: calm sea night", "img: ancient columns", "img: classical sculpture dark"]
    caption: "The 30-Day Rebuild — Day 8. Steady for one sentence. Then a slow look away.\n\n#30dayrebuild #eyecontact #presence #thestillman"
  - day: 9
    title: "Day 9 · The two-second pause"
    voiceover: >-
      Silence is not his enemy. Day nine... before every answer today, he counts two seconds. One... two. Then he speaks. The question gets his full attention. The answer gets his full weight. Rushed answers sound nervous. Paused ones... sound chosen. Day ten tomorrow. Follow so you don't miss it.
    highlight: [silence, two, seconds, weight, chosen]
    broll: ["img: hourglass dark", "img: marble statue face", "img: still lake mist", "img: marble bust light", "img: old clock dark", "img: fog mountains", "img: stone sculpture shadow", "img: classical sculpture light"]
    caption: "The 30-Day Rebuild — Day 9. Rushed answers sound nervous. Paused ones sound chosen.\n\n#30dayrebuild #communication #calm #thestillman"
  - day: 10
    title: "Day 10 · Taking up space"
    voiceover: >-
      A still man doesn't fold himself small. Day ten... wherever he sits today, he takes the whole chair. Back against it. Feet planted. Arms off his chest. Not sprawling... settled. A body that stops apologising changes how the mind feels. Day eleven tomorrow. Follow so you don't miss it.
    highlight: [small, whole, planted, settled, apologising]
    broll: ["img: empty chair window light", "img: marble statue seated", "img: stone throne", "img: marble bust profile", "img: ancient hall columns", "img: mountain summit", "img: classical sculpture dark", "img: wide empty room light"]
    caption: "The 30-Day Rebuild — Day 10. Not sprawling. Settled.\n\n#30dayrebuild #bodylanguage #posture #thestillman"
  - day: 11
    title: "Day 11 · Listening to the end"
    voiceover: >-
      Most people listen just to reply. Day eleven... he lets every sentence finish. No interrupting. No planning his answer halfway through. When they stop... one more second. Then one question about what they just said. People rarely forget the man who heard them. Day twelve tomorrow. Follow so you don't miss it.
    highlight: [listen, finish, interrupting, question, heard]
    broll: ["img: two coffee cups table", "img: marble statue face", "img: candle book dark", "img: marble bust profile", "img: quiet library", "img: calm sea dusk", "img: classical sculpture light", "img: night window rain"]
    caption: "The 30-Day Rebuild — Day 11. Let every sentence finish. Then one more second.\n\n#30dayrebuild #listening #socialskills #thestillman"
  - day: 12
    title: "Day 12 · Hands that stay still"
    voiceover: >-
      Nerves leak out through the hands. Day twelve... he catches his hands once every hour. No tapping. No spinning the phone. No touching his face. He rests them open on the table... or still at his sides. Quiet hands make the whole man look calm. Day thirteen tomorrow. Follow so you don't miss it.
    highlight: [nerves, hands, tapping, open, calm]
    broll: ["img: marble statue hands", "img: hands resting table", "img: marble bust dark", "img: stone sculpture hand", "img: candle flame dark", "img: still water reflection", "img: classical sculpture dark", "img: wooden table light"]
    caption: "The 30-Day Rebuild — Day 12. Quiet hands make the whole man look calm.\n\n#30dayrebuild #bodylanguage #nerves #thestillman"

  - id: tue-reel
    type: reel
    date: 2026-11-17
    time: "19:30"
    platforms: [instagram, tiktok]
    title: Silent in every group
    voiceover: >-
      He used to go silent... in every group conversation.
      He'd rehearse a line in his head. And by the time it was ready... the moment was gone.
      Then he changed one thing.
      No more speeches. Just one question. One per conversation.
      "Wait... how did that happen?"
      That's it.
      Six weeks later, he doesn't rehearse anymore. He just talks.
      One question. Every time.
    highlight: [silent, gone, one, question, talks, time]
    broll:

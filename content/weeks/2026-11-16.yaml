      - calm sea horizon sunrise
    caption: |-
      The loudest voice rarely holds the room. Steady does.

      Follow for one small rep a day.

      #thestillman #quietconfidence #bodylanguage #selfimprovement

  - id: mon-stoic-reel
    type: reel
    date: 2026-11-16
    time: "12:00"
    platforms: [instagram, tiktok]
    title: What stands in the way becomes the way
    voiceover: >-
      The obstacle... is not in the way.
      It is the way.
      Marcus Aurelius ruled Rome through plague and war,
      and in his private notes, he kept returning to this.
      What stands in the way... becomes the way.
      A still man does not ask, why me.
      He asks... what is this here to teach me?
      He does not wait for easier days.
      He lets the hard ones... train him.
    highlight: [obstacle, way, teach, still, train]

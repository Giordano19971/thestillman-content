    title: The loudest man
    voiceover: >-
      The most confident man in the room... is rarely the loudest.
      He speaks slower. He pauses... before he answers.
      He takes up space... without rushing to fill it.
      None of this is personality. It's practice.
      Calm is a skill. And skills... are built.
    highlight: [loudest, slower, pauses, space, practice, skill, built]

  - id: thu-reel
    type: reel
    date: 2026-11-19
    time: "19:30"
    platforms: [instagram, tiktok]
    title: Fake it till you make it
    voiceover: >-
      "Fake it till you make it."
      It's the most common advice men get. And it rarely works.
      Faking it creates tension. People feel it... even when they can't name it.
      Here's what works instead.
      Don't fake the feeling. Do the small action. Every day.
      Say hello first. Hold eye contact one second longer.
      Reps... not acting.
    highlight: [fake, tension, instead, action, reps]
    broll:

  - id: sat-reel
    type: reel
    date: 2026-11-21
    time: "19:30"
    platforms: [instagram, tiktok]
    title: Replaying the date
    voiceover: >-
      He kept replaying the date in his head... for days.
      Every pause. Every word he should have said.
      Then he tried something simple.
      That night, he wrote down two lines.
      One thing that went well. One thing to try next time.
      Then he closed the notebook.
      The replay stopped.
      Not because he stopped caring. Because he gave the thought... somewhere to go.
    highlight: [replaying, simple, two, lines, notebook, stopped]
    broll:
      - man lying bed night phone light ceiling
      - wet city street night lights
      - hand writing notebook lamp
      - closing notebook desk
      - sunrise horizon calm water
    caption: |-
      Overthinking needs an exit, not a fight. Two lines, then close the notebook.

      Follow for more.

      #thestillman #overthinking #dating #quietconfidence


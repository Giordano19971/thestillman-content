  - id: tue-reel
    type: reel
    date: 2026-11-17
    time: "19:30"
    platforms: [instagram, tiktok]
    title: Silent in every group
    voiceover: >-
      He used to go silent... in every group conversation.
      He'd rehearse a line in his head. And by the time it was ready... the moment was gone.
      Then he changed one thing.
      No more speeches. Just one question. One per conversation.
      "Wait... how did that happen?"
      That's it.
      Six weeks later, he doesn't rehearse anymore. He just talks.
      One question. Every time.
    highlight: [silent, gone, one, question, talks, time]
    broll:
      - friends at table bar from behind
      - man hands fidgeting with glass
      - man walking city morning from behind
      - group of friends laughing night
      - sunset horizon silhouette man
    caption: |-
      The fix wasn't confidence. It was one question.

      Follow for part 2: how to ask it without sounding scripted.

      #thestillman #quietconfidence #socialskills #conversation

  - id: wed-reel
    type: reel
    date: 2026-11-18
    time: "19:30"
    platforms: [instagram, tiktok]
    title: 10 seconds before any conversation
    voiceover: >-
      Try this... ten seconds before any conversation.
      Breathe in... for four.
      Out... for six.
      Again.
      Drop the shoulders. Chin level with the floor.
      One more breath.
      Now walk in.
      The body calms down first. The mind follows.
    highlight: [ten, four, six, shoulders, walk, follows]
    broll:
      - man standing in front of door from behind
      - man breathing slowly silhouette
      - man posture shoulders from behind
      - door opening warm light
    caption: |-
      Ten seconds. Before the meeting, the date, the call.

      Save it and try it today.

      #thestillman #quietconfidence #breathwork #calm


  title: He stopped explaining himself
  voiceover: There is a moment when a man stops explaining himself. Not out of pride. Out of calm. He says no... once. Clearly. Without the long story behind it. He doesn't defend every choice. He doesn't need the room to agree. A short answer, said gently... carries more weight than a speech.
